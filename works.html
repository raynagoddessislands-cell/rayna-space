<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学新要塞 - WORKSアーカイブ</title>
    <style>
        body {
            background-color: #0a0a16;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-nav {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        /* トップへ戻るための帰還ボタン */
        .btn-back {
            color: #ff0055;
            text-decoration: none;
            border: 1px solid #ff0055;
            padding: 5px 15px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 10px #ff0055;
        }

        h2 {
            font-size: 2rem;
            text-shadow: 0 0 15px #00ffcc;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }

        /* 作品を格納するセクタースロット */
        .card {
            background: rgba(20, 20, 40, 0.6);
            padding: 25px;
            border-radius: 8px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* 【新兵装】スロット01専用：ピンクのネオンパルスアニメーション */
        .card-vol1 {
            border: 2px solid #ff0055;
            animation: neonPulsePink 3s infinite alternate;
        }

        /* 【新兵装】スロット02専用：グリーンのネオンパルスアニメーション */
        .card-ufo {
            border: 2px solid #00ffcc;
            animation: neonPulseGreen 3s infinite alternate;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-type {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .text-pink { color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        .text-green { color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }

        .card-title {
            color: #fff;
            font-size: 1.3rem;
            margin: 10px 0;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* 【新兵装】タイピングテキストを格納するコンテナ */
        .story-text {
            color: #aaa;
            font-size: 0.9rem;
            min-height: 4.5em; /* テキスト出現中のガタつき防止 */
            line-height: 1.5;
        }

        /* カーソルが点滅する演出 */
        .story-text::after {
            content: '_';
            animation: blink 0.8s infinite;
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0;
        }

        /* 購買・閲覧ゲートを起動するボタン */
        .btn-gate {
            display: block;
            text-align: center;
            background: transparent;
            padding: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .btn-gate-pink {
            color: #ff0055;
            border: 1px solid #ff0055;
        }
        .btn-gate-pink:hover {
            background: #ff0055;
            color: #0a0a16;
            box-shadow: 0 0 15px #ff0055;
        }

        .btn-gate-green {
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }
        .btn-gate-green:hover {
            background: #00ffcc;
            color: #0a0a16;
            box-shadow: 0 0 15px #00ffcc;
        }

        /* アニメーション定義：ピンクパルス */
        @keyframes neonPulsePink {
            0% { box-shadow: 0 0 5px rgba(255, 0, 85, 0.2); border-color: rgba(255, 0, 85, 0.5); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); border-color: rgba(255, 0, 85, 1); }
        }

        /* アニメーション定義：グリーンパルス */
        @keyframes neonPulseGreen {
            0% { box-shadow: 0 0 5px rgba(0, 255, 204, 0.2); border-color: rgba(0, 255, 204, 0.5); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.6); border-color: rgba(0, 255, 204, 1); }
        }

        /* カーソル点滅 */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="btn-back">◀ 要塞中心核へ帰還</a>
    </div>

    <h2>【作品アーカイブ領域】</h2>

    <div class="grid">
        <!-- スロット1：有料宇宙哲学書 -->
        <div class="card card-vol1">
            <div class="card-type text-pink">[VOLUME 01 / 電子図書館閲覧権]</div>
            <div class="card-title">宇宙哲学分冊 第1巻（仮）</div>
            <!-- タイピング演出が流れる領域 -->
            <div class="story-text" id="type-vol1"></div>
            <div class="card-price text-pink">価格: ￥2,000</div>
            <div class="btn-gate btn-gate-pink" onclick="triggerPurchase()">決済ゲートを起動</div>
        </div>

        <!-- スロット2：UFOスケルトンPDF -->
        <div class="card card-ufo">
            <div class="card-type text-green">[DATA FILE / 極秘付録]</div>
            <div class="card-title">オリジナルUFOスケルトン設計図</div>
            <!-- タイピング演出が流れる領域 -->
            <div class="story-text" id="type-ufo"></div>
            <div class="card-price text-green">価格: ￥0 (限定特典)</div>
            <div class="btn-gate btn-gate-green" onclick="alert('UFO設計図のダウンロードリンク、または簡易ビューアへ接続します。')">データを開く</div>
        </div>
    </div>

    <script>
        // 【新兵装】タイピングエフェクト制御スクリプト
        const textVol1 = "ここにサスペンスとロマンを孕んだ、人類の意識を進化させるあらすじが展開されます。現在、副官の手により文章の同期（アップデート）を待機中…。";
        const textUFO = "機密解除されたUFOの内部構造を完全可視化した、特製スケルトンPDFデータ。閲覧には高尚な精神の覚醒が必要となる。";

        function typeWriter(elementId, text, speed) {
            let i = 0;
            const element = document.getElementById(elementId);
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // ページ読み込み完了時にタイピングを開始（文字送り速度: 50ミリ秒）
        window.onload = function() {
            typeWriter("type-vol1", textVol1, 50);
            setTimeout(() => {
                typeWriter("type-ufo", textUFO, 50);
            }, 1000); // 2つ目のカードは1秒遅らせて起動
        };

        function triggerPurchase() {
            alert('【通信中】これより暗号化決済ゲート（Stripe連携予定地）との同期を試みます。フェーズ3の拡張をお待ちください。');
        }
    </script>
</body>
</html>
