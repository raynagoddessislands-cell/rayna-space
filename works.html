<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学新要塞 - WORKSアーカイブ</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* ========================================================
           【絶対聖域シールド】ページ全体で文字ドラッグ・選択を強制フリーズ
           ======================================================== */
        body {
            background-color: #040408;
            color: #00ffcc;
            font-family: 'Share Tech Mono', 'Courier New', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            position: relative;

            /* ドラッグ選択をすべてのブラウザで根こそぎ禁止 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html { height: -webkit-fill-available; }

        #comet-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; 
            pointer-events: none;
        }

        .header-nav {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
            z-index: 10;
            position: relative;
        }

        .btn-back {
            color: #ff007f;
            text-decoration: none;
            border: 1px solid #ff007f;
            padding: 5px 15px;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-shadow: 0 0 5px #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-back:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px #ff007f;
        }

        h2 {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(1.4rem, 6vw, 2rem);
            text-shadow: 0 0 15px #00ffcc;
            margin-bottom: 40px;
            letter-spacing: 2px;
            z-index: 10;
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px;
            z-index: 10;
            position: relative;
        }

        .card {
            background: rgba(4, 4, 8, 0.92);
            padding: 25px;
            border-radius: 8px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
        }

        .card-type {
            font-size: 0.8rem;
            color: #ff007f;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #ff007f;
        }

        .card-title {
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            margin: 15px 0;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .story-text {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-price {
            color: #ff007f;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 5px #ff007f;
        }

        .btn-gate {
            display: block;
            text-align: center;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 20; 
        }
        .btn-gate:hover {
            background: #00ffcc;
            color: #040408;
            box-shadow: 0 0 25px #00ffcc;
        }
    </style>
</head>
<body>

    <canvas id="comet-canvas"></canvas>

    <div class="header-nav">
        <a href="index.html" class="btn-back">◀ 要塞中心核へ帰還</a>
    </div>

    <h2>【作品アーカイブ領域】</h2>

    <div class="grid">
        <div class="card">
            <div class="card-type">[VOLUME 01 / 有料図書館閲覧権]</div>
            <div class="card-title">宇宙哲学分冊 第1巻（仮）</div>
            <p class="story-text">ここにサスペンスとロマンを孕んだ、人類の意識を進化させる閣下の真のあらすじが展開されます。</p>
            <div class="card-price">価格: ￥2,000</div>
            <!-- 先ほど100%成功した、解錠実験室（test-gate.html）へ直結 -->
            <a href="test-gate.html" class="btn-gate">決済ゲートを起動</a>
        </div>

        <div class="card" style="border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);">
            <div class="card-type" style="color: #00ffcc; text-shadow: 0 0 5px #00ffcc;">[DATA FILE / 極秘付録]</div>
            <div class="card-title">オリジナルUFOスケルトン設計図</div>
            <p class="story-text">機密解除されたUFOの構造を完全可視化した、特製スケルトンPDFデータ。</p>
            <div class="card-price" style="color: #00ffcc; text-shadow: 0 0 5px #00ffcc;">価格: ￥0 (限定特典)</div>
            <a href="#" class="btn-gate" style="color: #00ffcc; border-color: #00ffcc; z-index: 20;" onclick="alert('UFO設計図のダウンロードを開始、または簡易ビューアへ接続します。')">データを開く</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('comet-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const particles = [];
        window.addEventListener('mousemove', function(e) { spawnParticles(e.clientX, e.clientY); });
        window.addEventListener('touchmove', function(e) { if (e.touches.length > 0) spawnParticles(e.touches.clientX, e.touches.clientY); }, { passive: true });
        window.addEventListener('touchstart', function(e) { if (e.touches.length > 0) spawnParticles(e.touches.clientX, e.touches.clientY, 6); }, { passive: true });
        function spawnParticles(x, y, count = 2) { for (let i = 0; i < count; i++) { particles.push(new Particle(x, y)); } }
        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y; this.speedX = (Math.random() - 0.5) * 3.5; this.speedY = (Math.random() - 0.5) * 3.5; this.size = Math.random() * 3 + 1;
                const colors = ['#00ffcc', '#ff0055', '#ffffff', '#3399ff', '#ffcc00']; this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1; this.decay = Math.random() * 0.025 + 0.015;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= this.decay; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowBlur = 8; ctx.shadowColor = this.color; ctx.fill(); ctx.restore(); }
        }
        const staticStars = [];
        for (let i = 0; i < 40; i++) { staticStars.push({ x: Math.random(), y: Math.random(), size: Math.random() * 1.8 + 0.4, angle: Math.random() * Math.PI, speed: Math.random() * 0.02 + 0.01 }); }

        // ========================================================
        // 【絶対聖域シールド】右クリック及びコピーショートカットを強制遮断
        // ========================================================
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.keyCode === 67) {
                e.preventDefault();
                alert('【警告】セキュリティシールド作動：この聖域の知的財産はコピー不可能です。');
                return false;
            }
        });

        function animate() {
            ctx.fillStyle = 'rgba(4, 4, 8, 0.25)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            staticStars.forEach(star => { star.angle += star.speed; ctx.save(); ctx.globalAlpha = 0.15 + Math.abs(Math.sin(star.angle)) * 0.85; ctx.beginPath(); ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore(); });
            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(); if (particles[i].alpha <= 0) particles.splice(i, 1); }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
