<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(180deg, #b0c8d6 0%, #dcdcf7 50%, #e8edf3 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(255,255,255,0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(214,214,245,0.5) 0%, transparent 70%);
            filter: url(#watercolor-blur);
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .reeds-shadow {
            position: absolute;
            bottom: 0;
            left: 8%;
            width: 180px;
            height: 240px;
            background: linear-gradient(15deg, rgba(26,42,58,0.15) 0%, transparent 80%);
            clip-path: polygon(10% 100%, 15% 20%, 25% 100%, 40% 40%, 50% 100%, 65% 5%, 75% 100%, 85% 30%, 90% 100%);
            filter: blur(4px);
            z-index: 2;
            pointer-events: none;
            transform-origin: bottom center;
            animation: sway 6s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0% { transform: rotate(-2deg) skewX(-2deg); }
            100% { transform: rotate(2deg) skewX(2deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .title {
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 0.35em;
            color: #1a2a3a;
            margin-bottom: 35px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .btn-works {
            background: rgba(26,42,58,0.03);
            border: 1px solid #1a2a3a;
            color: #1a2a3a;
            padding: 12px 50px;
            font-size: 14px;
            letter-spacing: 0.25em;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-works:hover {
            background: #1a2a3a;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(26,42,58,0.1);
        }
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" style="position: absolute; width: 0; height: 0;">
        <filter id="watercolor-blur">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="reeds-shadow"></div>

    <div class="container">
        <div class="title">Rayna Kamisima</div>
        <button class="btn-works" onclick="location.href='/works'">Works</button>
    </div>

</body>
</html>
