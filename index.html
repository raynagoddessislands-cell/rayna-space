<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(180deg, #a2bccc 0%, #d6d6f5 40%, #f0f4f8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(70deg, transparent 30%, rgba(255,255,255,0.25) 45%, rgba(255,255,255,0.4) 48%, transparent 55%),
                linear-gradient(-35deg, transparent 20%, rgba(255,255,255,0.2) 35%, rgba(255,255,255,0.3) 40%, transparent 50%);
            filter: url(#watercolor-blur);
            opacity: 0.85;
            pointer-events: none;
            z-index: 1;
        }

        .reeds {
            position: absolute;
            bottom: -10px;
            left: 5%;
            width: 250px;
            height: auto;
            opacity: 0.25;
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .title {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 0.3em;
            color: #1a2a3a;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn-works {
            background: none;
            border: 1px solid #1a2a3a;
            color: #1a2a3a;
            padding: 10px 40px;
            font-size: 14px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-works:hover {
            background: #1a2a3a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" style="display: none;">
        <filter id="watercolor-blur">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="container">
        <div class="title">Rayna Kamisima</div>
        <button class="btn-works" onclick="location.href='/works'">Works</button>
    </div>

</body>
</html>
