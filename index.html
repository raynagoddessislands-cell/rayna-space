<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space | 神島玲奈 宇宙哲学本陣</title>
    <style>
        /* 閣下のご意志である、淡い空と美しい筋雲の流れる宇宙を表現したデザイン */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, #b0c4de 0%, #e6e6fa 40%, #ffffff 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none; /* 絶対防衛コピープロテクション */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 流れるような淡い筋雲のフォースを視覚化 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 20%, rgba(255,255,255,0.6) 0%, transparent 60%);
            opacity: 0.7;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .title {
            color: #ffffff;
            font-size: 3.5rem;
            letter-spacing: 0.4em;
            margin-bottom: 30px;
            text-shadow: 0px 0px 10px rgba(0, 0, 0, 0.15), 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: 300;
            text-transform: uppercase;
        }

        .works-box {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 12px 60px;
            color: #ffffff;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RAYNA KAMISIMA</div>
        <div class="works-box">Works</div>
    </div>
</body>
</html>
