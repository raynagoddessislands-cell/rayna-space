<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space | 神島玲奈 宇宙哲学本陣</title>
    <style>
        /* 白飛びを完全に抑え込み、落ち着いた淡い空の階調を表現 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            /* 色彩の深みを増し、白に負けない背景土台を構築 */
            background: linear-gradient(180deg, #8ba8c7 0%, #bebee3 50%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none; /* 絶対防衛コピープロテクション */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 眩しすぎた光の帯の透明度を下げ、繊細なたなびく「筋雲」として定着 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(65deg, transparent 35%, rgba(255,255,255,0.15) 43%, rgba(255,255,255,0.25) 48%, transparent 53%),
                linear-gradient(-40deg, transparent 25%, rgba(255,255,255,0.12) 32%, rgba(255,255,255,0.22) 37%, transparent 45%),
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0.9;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        /* 文字の視認性をさらに高め、輪郭をくっきりと洗練 */
        .title {
            color: #2d3748;
            font-size: 3.5rem;
            letter-spacing: 0.4em;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9);
            font-weight: 300;
            text-transform: uppercase;
        }

        .works-box {
            display: inline-block;
            border: 1px solid #2d3748;
            padding: 12px 60px;
            color: #2d3748;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RAYNA KAMISIMA</div>
        <div class="works-box">Works</div>
    </div>
</body>
</html>
