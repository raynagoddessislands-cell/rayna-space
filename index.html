<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space | 神島玲奈 宇宙哲学本陣</title>
    <style>
        /* 俗世のノイズを消し去る漆黒の世界観 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            overflow: hidden;
            -webkit-user-select: none; /* 絶対防衛コピープロテクション */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 宇宙空間の器 */
        .space-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0d1a 0%, #000 100%);
            transition: transform 7s cubic-bezier(0.1, 0.8, 0.2, 1);
            z-index: 1;
        }

        /* 映画級大ズームアップ発動時の挙動 */
        .space-container.zoom {
            transform: scale(1.6);
        }

        /* AIstudio風：星々の瞬きエフェクト */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #fff; }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* シネマスコープ（映画館の上下黒帯） */
        .cinema-bolt {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0;
            background: #000;
            z-index: 10;
            transition: height 1.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .bolt-top { top: 0; }
        .bolt-bottom { bottom: 0; }

        .cinema-active .bolt-top,
        .cinema-active .bolt-bottom {
            height: 14vh; /* 映画の荘厳な画角へ */
        }

        /* 操縦席（メインUI） */
        .interface {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: opacity 1.2s ease, filter 1.2s ease;
        }

        .works-trigger {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.7);
            color: #fff;
            padding: 18px 50px;
            font-size: 1.3rem;
            letter-spacing: 0.4em;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(4px);
        }

        .works-trigger:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255,255,255,0.8), inset 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 0.5em;
        }

        /* 映画風シネマタイポグラフィ（2分割フレーズ） */
        .cinema-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .phrase {
            font-size: 2.4rem;
            letter-spacing: 0.5em;
            margin: 25px 0;
            opacity: 0;
            filter: blur(20px);
            transform: scale(0.9);
            transition: opacity 2.5s cubic-bezier(0.25, 1, 0.5, 1), filter 2.5s cubic-bezier(0.25, 1, 0.5, 1), transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
            font-weight: 300;
        }

        .phrase.reveal {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1);
        }
    </style>
</head>
<body>

    <!-- 上下シネマスコープ -->
    <div class="cinema-bolt bolt-top"></div>
    <div class="cinema-bolt bolt-bottom"></div>

    <!-- キラキラ輝く宇宙空間の器 -->
    <div class="space-container" id="space"></div>

    <!-- 初期インターフェース -->
    <div class="interface" id="ui">
        <h1 style="letter-spacing: 0.6em; font-weight: 300; margin-bottom: 60px; font-size: 2.8rem; text-shadow: 0 0 20px rgba(255,255,255,0.2);">RAYNA KAMISIMA</h1>
        <button class="works-trigger" onclick="launchCinema()">Works</button>
    </div>

    <!-- 視聴覚タイポグラフィの舞台 -->
    <div class="cinema-text-container">
        <p class="phrase" id="p1">今、神島玲奈が渾身の力で描く！</p>
        <p class="phrase" id="p2">宇宙と人間の真実が明かされる！</p>
    </div>

    <script>
        // 宇宙に何百ものキラキラ光る星々を自動生成する妙法
        const space = document.getElementById('space');
        const starCount = 150; // 星の総数

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // ランダム配置
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            
            // 星の大きさにバリエーションを持たせる（AIstudio風）
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            // 瞬きの速度と時間差（時間的な美しさ）をバラバラにする
            const duration = 2 + Math.random() * 4;
            const delay = Math.random() * 5;
            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `${delay}s`;
            
            space.appendChild(star);
        }

        // 映画風ズームアップ＆テキスト展開演出
        function launchCinema() {
            // UIを静かに消去（ブラーをかけながら）
            document.getElementById('ui').style.opacity = '0';
            document.getElementById('ui').style.filter = 'blur(10px)';
            setTimeout(() => {
                document.getElementById('ui').style.display = 'none';
            }, 1200);

            // シネマスコープ＆背景大宇宙ズーム発動
            document.body.classList.add('cinema-active');
            document.getElementById('space').classList.add('zoom');

            // 第1幕：1.8秒後に深みから浮かび上がる
            setTimeout(() => {
                document.getElementById('p1').classList.add('reveal');
            }, 1800);

            // 第2幕：5.5秒後に圧倒的な調和をもって現る
            setTimeout(() => {
                document.getElementById('p2').classList.add('reveal');
            }, 5500);
        }

        /* ==========================================
           『宇宙神話・新創世記』絶対防衛トラップ
           ========================================== */
        document.addEventListener('contextmenu', e => e.preventDefault(), false);
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 83)) {
                e.preventDefault();
                return false;
            }
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
        }, false);
    </script>
</body>
</html>
