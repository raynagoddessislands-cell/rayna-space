<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学文芸神殿 - Cosmic Philosophy Sanctuary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #060913 0%, #020306 100%);
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            color: #f5f6f8;
        }
        #comet-engine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .sanctuary-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            transition: opacity 1.5s ease;
        }
        /* 画面遷移時のフェードアウト */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .decree-box {
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: soakIn 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.5s;
        }
        .decree-title {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            color: #a3b8cc;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .decree-text {
            font-size: 1.4rem;
            line-height: 2.2;
            letter-spacing: 0.25em;
            font-weight: 300;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        .control-trigger {
            margin-top: 4rem;
            padding: 1rem 2.5rem;
            background: transparent;
            border: 1px solid rgba(163, 184, 204, 0.4);
            color: #a3b8cc;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 1.5s;
            box-shadow: 0 0 15px rgba(163, 184, 204, 0.05);
        }
        /* タッチ時の一瞬の輝き */
        .control-trigger:active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }
        @keyframes soakIn {
            0% { opacity: 0; transform: translateY(15px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="comet-engine"></canvas>

    <div class="sanctuary-container" id="main-ui">
        <div class="decree-box">
            <p class="decree-title">Cosmic Philosophy Decree</p>
            <p class="decree-text">
                未明の静寂に刻まれる真理。<br>
                俗世の価値を排し、<br>
                深遠なる美の神殿へ歩みを進めよ。
            </p>
        </div>

        <button class="control-trigger" id="lock-on-button" onclick="awakenSanctuary(event)">神殿の深淵へ</button>
    </div>

    <script>
        const canvas = document.getElementById('comet-engine');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let isBursting = false;

        const cometColors = [
            'rgba(147, 197, 253, 0.6)', // 彗星青
            'rgba(244, 197, 249, 0.6)', // 星雲紫
            'rgba(253, 244, 175, 0.5)', // 星塵金
            'rgba(167, 243, 208, 0.5)', // 深宇宙緑
            'rgba(255, 255, 255, 0.8)'  // 純白光
        ];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, type = 'normal', angle = 0, speed = 0) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.color = cometColors[Math.floor(Math.random() * cometColors.length)];
                
                if (this.type === 'burst') {
                    // 「激しく外側へ吹き飛ぶ」爆発の物理演算
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 4 + 1.5; // 粒のサイズを大型化
                    this.decay = Math.random() * 0.015 + 0.008; // 激しく燃え尽きる
                } else {
                    // 通常時の優美な揺らめき
                    this.vx = (Math.random() - 0.5) * (type === 'touch' ? 2.0 : 0.4);
                    this.vy = (Math.random() - 0.7) * (type === 'touch' ? 2.0 : 0.5) - 0.2;
                    this.size = Math.random() * (type === 'touch' ? 3.0 : 1.8) + 0.5;
                    this.decay = Math.random() * 0.005 + 0.003;
                }
                this.alpha = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // 爆発時はわずかに宇宙の摩擦（減速）をかける
                if (this.type === 'burst') {
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                }
                
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // 現代っ子の視覚を刺激する強烈なグロウ（発光効果）
                ctx.shadowBlur = this.type === 'burst' ? 20 : 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 定常的な星屑の湧き出し
        function injectNaturalSparks() {
            if (!isBursting && particles.length < 50 && Math.random() < 0.08) {
                particles.push(new Particle(Math.random() * canvas.width, canvas.height * 0.85, 'normal'));
            }
        }

        // スマホ・タッチ強化：指先から高密度に溢れる五色の星屑
        window.addEventListener('touchmove', (e) => {
            if (isBursting) return;
            const touch = e.touches[0];
            for(let i=0; i<3; i++) {
                particles.push(new Particle(touch.clientX, touch.clientY, 'touch'));
            }
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (isBursting || Math.random() > 0.4) return;
            particles.push(new Particle(e.clientX, e.clientY, 'touch'));
        });

        function animate() {
            // 前のフレームの残像をわずかに残す（水彩の滲み・光の尾）
            ctx.fillStyle = 'rgba(2, 3, 6, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            injectNaturalSparks();
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 閣下命ずるところの「星塵の嵐」バーストシステム起動
        function awakenSanctuary(event) {
            if (isBursting) return;
            isBursting = true;

            const button = document.getElementById('lock-on-button');
            const rect = button.getBoundingClientRect();
            // ボタンの中心点を爆発の特異点とする
            const burstX = rect.left + rect.width / 2;
            const burstY = rect.top + rect.height / 2;

            // UIを静かにフェードアウト
            document.getElementById('main-ui').classList.add('fade-out');

            // 300発の超高密度「星塵の嵐」を全方位へ射出！
            const particleCount = 300;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                // 内側から外側へ吹き飛ぶ激しい初速（現代的刺激）
                const speed = Math.random() * 8 + 4; 
                particles.push(new Particle(burstX, burstY, 'burst', angle, speed));
            }

            // 嵐が吹き荒れた後、美しく暗転し第2ステージへと完全遷移
            setTimeout(() => {
                alert('【宇宙哲学文芸神殿】第2ステージ：文芸館（水彩個展エリア）のメインホールへ突入します。');
                // 実運用時はここに次のページのURLへの遷移処理を記述
                isBursting = false;
                document.getElementById('main-ui').classList.remove('fade-out');
            }, 1800);
        }
    </script>
</body>
</html>
