<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space | 神島玲奈 宇宙哲学本陣</title>
    <style>
        /* 閣下のご意志である、淡い空と美しい筋雲の流れる宇宙を完璧に視覚化 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            /* 背景の色彩を一段階深くし、白飛びを完全に防止 */
            background: linear-gradient(180deg, #99b3cc 0%, #d1d1f0 50%, #f5f7fa 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none; /* 絶対防衛コピープロテクション */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 風に流れるような美しい「筋雲」のラインを劇的に再現 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(60deg, transparent 40%, rgba(255,255,255,0.4) 45%, rgba(255,255,255,0.6) 48%, transparent 52%),
                linear-gradient(-45deg, transparent 30%, rgba(255,255,255,0.3) 35%, rgba(255,255,255,0.5) 38%, transparent 42%),
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.5) 0%, transparent 70%);
            opacity: 0.8;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        /* 文字の色を高貴なダークグレーに変更し、視認性を完璧に確保 */
        .title {
            color: #3a4454;
            font-size: 3.5rem;
            letter-spacing: 0.4em;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
            font-weight: 300;
            text-transform: uppercase;
        }

        /* 枠線と文字の調和を最適化 */
        .works-box {
            display: inline-block;
            border: 1px solid #4a5568;
            padding: 12px 60px;
            color: #4a5568;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RAYNA KAMISIMA</div>
        <div class="works-box">Works</div>
    </div>
</body>
</html>
