<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学新要塞 - 神島玲奈指令官の領域</title>
    <style>
        /* 宇宙とゲーミングを融合したダークサイバー精神 */
        body {
            background-color: #05050a; /* 深淵なる漆黒宇宙 */
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 10px #00ffcc;
            position: relative;
        }

        /* マウスストーカーを描画する透明なキャンバス */
        #comet-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none; /* 下にあるボタンのクリックを邪魔しない */
        }

        /* 要塞の統制コンソール（メインUI） */
        .container {
            text-align: center;
            border: 2px solid #ff0055;
            padding: 40px;
            background: rgba(5, 5, 10, 0.85);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(4px);
            box-sizing: border-box;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff0055;
        }

        .title-sub {
            color: #ff0055;
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* 共通ボタン基本仕様 */
        .btn-works {
            display: inline-block;
            background: transparent;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
            max-width: 350px;
        }

        /* グリーンボタン仕様（WORKS） */
        .btn-green {
            color: #00ffcc;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            margin-bottom: 15px;
        }
        .btn-green:hover {
            background: #00ffcc;
            color: #05050a;
            box-shadow: 0 0 30px #00ffcc;
            transform: scale(1.03);
        }

        /* ピンクボタン仕様（AI CONSULTATION） */
        .btn-pink {
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }
        .btn-pink:hover {
            background: #ff0055;
            color: #05050a;
            box-shadow: 0 0 30px #ff0055;
            transform: scale(1.03);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #8888aa;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 彗星と火花の星々を描画する高尚な電子キャンバス -->
    <canvas id="comet-canvas"></canvas>

    <div class="container">
        <h1>神島玲奈 宇宙哲学新要塞</h1>
        <div class="title-sub">MISSION: 地球文明救済</div>
        
        <p>「読者をサスペンスとロマンへ没頭させる高尚なゲーミング遊び場」</p>
        <p style="color: #8888aa; font-size: 0.9rem; margin-bottom: 40px;">※現在、副官の手により要塞拡張工事中</p>

        <!-- 各重要セクターへのワープゲートボタン -->
        <a href="works.html" class="btn-works btn-green">WORKS</a>
        <br>
        <a href="consultation.html" class="btn-works btn-pink">AI CONSULTATION</a>
    </div>

    <div class="footer">
        &copy; 宇宙総合指令官提督 神島玲奈 / Powered by Cloudflare Pages
    </div>

    <script>
        const canvas = document.getElementById('comet-canvas');
        const ctx = canvas.getContext('2d');

        // キャンバスのサイズを画面全体に同期
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const mouse = { x: null, y: null };

        // マウスの軌跡（またはタッチ操作）を感知
        window.addEventListener('mousemove', function(e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            // マウスが動くたびに星の子供（火花）を生成
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(mouse.x, mouse.y));
            }
        });

        // スマートフォン等のタッチ操作にもフォースを同期
        window.addEventListener('touchmove', function(e) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(mouse.x, mouse.y));
            }
        });

        // 星の子供（火花粒子）のクラス定義
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // 彗星の尾のようにわずかに四方に散る速度
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
                // 星の子供の初期サイズ
                this.size = Math.random() * 3 + 1;
                // 色は閣下のネオンピンクとサイバーグリーン、ホワイトの煌めき
                const colors = ['#00ffcc', '#ff0055', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                // 生存時間（透明度）
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01; // 消えていく速度
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // 火花のような光彩（グロー効果）
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 定常背景として、あらかじめ宇宙にただよう常駐の星々も15個配置
        const staticStars = [];
        for (let i = 0; i < 15; i++) {
            staticStars.push({
                x: Math.random(),
                y: Math.random(),
                size: Math.random() * 2 + 0.5,
                angle: Math.random() * Math.PI
            });
        }

        // 要塞の描画ループ（アニメーションフレーム）
        function animate() {
            // 前のフレームをうっすら残して残像（彗星の尾）を作る
            ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 常駐の星々を静かにまたたかせる
            staticStars.forEach(star => {
                star.angle += 0.02;
                ctx.save();
                ctx.globalAlpha = 0.3 + Math.abs(Math.sin(star.angle)) * 0.7;
                ctx.beginPath();
                ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.restore();
            });

            // マウスを追いかける星の子供たちを更新・描画
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                // 完全に透明になった火花は消滅（メモリ解放）
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
