<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学総合指令部 - 新要塞文芸館</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030308;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 超彗星エンジン用最背面キャンバス */
        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 妖艶なショッキングピンクネオンの要塞城門 */
        .gate-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 550px;
            border: 3px solid #ff007f;
            box-shadow: 0 0 20px #ff007f, inset 0 0 20px #ff007f;
            border-radius: 16px;
            padding: 30px;
            background: rgba(5, 5, 12, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1;
            text-align: center;
            box-sizing: border-box;
        }

        /* 一列を絶対死守する青水色のタイトル */
        h1 {
            color: #00ffff;
            text-shadow: 0 0 12px #00ffff;
            font-size: 1.4rem;
            margin-top: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.05em;
        }

        /* ゲーミングシステムログエリア */
        .system-log-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 120px;
            overflow-y: hidden;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #00ff66;
            text-shadow: 0 0 4px #00ff66;
            line-height: 1.5;
            margin: 20px 0;
        }

        /* 聖域ミッション起動ボタン */
        .btn-enter-fortress {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: #000;
            color: #ffffff;
            border: 2px solid #00ffff;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-enter-fortress:hover, .btn-enter-fortress:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 五色に煌めく超彗星エンジン -->
    <canvas id="universeCanvas"></canvas>

    <!-- 城門インターフェース -->
    <div class="gate-wrapper">
        <h1 id="neonTitle">🌌 宇宙哲学新要塞・文芸館 🌌</h1>
        
        <!-- 自動タイピングログ -->
        <div class="system-log-box" id="logBox"></div>

        <!-- 外部インフラ（BOOTHやKindle等）への接続リンク（ミッション起動ゲート） -->
        <!-- 閣下が現在お使いの、または今後展開する本物の配信URLを href="..." に設定してください -->
        <a href="https://amazon.co.jp" target="_blank" class="btn-enter-fortress" id="gateButton" style="visibility: hidden;">
            🚀 宇宙金貨２枚：文芸聖域ミッションを起動
        </a>
    </div>

    <script>
        // ーーー ゲーミングシステムログ・タイピングエンジン ーーー
        const logs = [
            "[SYSTEM] 新要塞防衛シールド 出力100%展開...",
            "[AUTHENTICATION] 最高責任者・神島玲奈の承認パルスを検知...",
            "[DATA] 破損データの完全排除シーケンス 完了...",
            "[INFO] 秋風の誘いにより、精神的属性の同調を確認...",
            "[SUCCESS] 読者予備軍のアクセスゲートを開放しました。"
        ];

        let logIndex = 0;
        const logBox = document.getElementById('logBox');
        const gateButton = document.getElementById('gateButton');

        function printLog() {
            if (logIndex < logs.length) {
                const p = document.createElement('div');
                logBox.appendChild(p);
                let charIndex = 0;
                let currentText = logs[logIndex];
                
                function typeChar() {
                    if (charIndex < currentText.length) {
                        p.innerHTML += currentText.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeChar, 25);
                    } else {
                        logBox.scrollTop = logBox.scrollHeight;
                        logIndex++;
                        setTimeout(printLog, 400);
                    }
                }
                typeChar();
            } else {
                // すべてのログ出力完了後、ミッションボタンをパッと現出
                gateButton.style.visibility = 'visible';
                gateButton.style.animation = 'fadeIn 0.5s ease-in-out';
            }
        }
        
        // 起動から1秒後にログ開始
        setTimeout(printLog, 1000);

        // ーーー スマホ・PC完全対応：五色の超彗星パーティクル ーーー
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const cosmicColors = ['#ff007f', '#00ffff', '#ffea00', '#00ff66', '#bd00ff'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, isStar = false) {
                this.x = x;
                this.y = y;
                this.isStar = isStar;
                this.size = isStar ? Math.random() * 1.5 : Math.random() * 3 + 1;
                this.color = isStar ? '#ffffff' : cosmicColors[Math.floor(Math.random() * cosmicColors.length)];
                this.speedX = isStar ? 0 : (Math.random() - 0.5) * 2;
                this.speedY = isStar ? Math.random() * 0.1 + 0.05 : (Math.random() - 0.5) * 2;
                this.alpha = 1;
                this.decay = isStar ? 0 : Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (!this.isStar) this.alpha -= this.decay;
                else if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 満天の星々の常駐
        for (let i = 0; i < 70; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height, true));
        }

        function spawnParticles(x, y) {
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(x, y, false));
            }
        }

        function autoTitlePulse() {
            const titleEl = document.getElementById('neonTitle');
            if(titleEl) {
                const rect = titleEl.getBoundingClientRect();
                const randomX = rect.left + Math.random() * rect.width;
                const randomY = rect.top + Math.random() * rect.height;
                spawnParticles(randomX, randomY);
            }
        }

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) spawnParticles(e.touches.clientX, e.touches.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            spawnParticles(e.clientX, e.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            autoTitlePulse();
            particles = particles.filter(p => p.isStar || p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
