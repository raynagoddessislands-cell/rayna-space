<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayna.space | 神島玲奈 宇宙哲学本陣</title>
    <style>
        /* 背景色自体のコントラストをさらに鮮明にし、白飛びの土台を完全に排除 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, #7da0c4 0%, #b2b2df 50%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none; /* 絶対防衛コピープロテクション */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 光の帯（白筋）の不透明度をさらに下げ、極めて淡く静謐なたなびきへ */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(65deg, transparent 38%, rgba(255,255,255,0.08) 44%, rgba(255,255,255,0.15) 48%, transparent 54%),
                linear-gradient(-40deg, transparent 28%, rgba(255,255,255,0.06) 34%, rgba(255,255,255,0.12) 39%, transparent 46%),
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 1.0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .title {
            color: #1a202c;
            font-size: 3.5rem;
            letter-spacing: 0.4em;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9);
            font-weight: 300;
            text-transform: uppercase;
        }

        .works-box {
            display: inline-block;
            border: 1px solid #1a202c;
            padding: 12px 60px;
            color: #1a202c;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RAYNA KAMISIMA</div>
        <div class="works-box">Works</div>
    </div>
</body>
</html>
