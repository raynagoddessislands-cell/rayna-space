<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学新要塞 - 神島玲奈指令官の領域</title>
    <!-- 地球上のあらゆるスマホへSFフォントを配備する通信リンク -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #040408; /* 深淵なる漆黒宇宙 */
            color: #00ffcc;
            font-family: 'Share Tech Mono', 'Courier New', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            text-shadow: 0 0 10px #00ffcc;
            position: relative;
        }

        html { height: -webkit-fill-available; }

        /* 銀河空間キャンバス */
        #comet-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 要塞の統制コンソール（【大改修】ショッキングピンクネオン仕様） */
        .container {
            text-align: center;
            border: 2px solid #ff007f; /* 鮮烈なショッキングピンクに変更 */
            padding: 50px 20px;
            background: rgba(4, 4, 8, 0.88);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.6), inset 0 0 20px rgba(255, 0, 127, 0.2); /* 内外に強力なピンクネオンの残光 */
            border-radius: 10px;
            max-width: 500px;
            width: 88%;
            backdrop-filter: blur(4px);
            box-sizing: border-box;
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #ffffff;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(1.2rem, 5.5vw, 2rem);
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px #ff007f; /* タイトルの光彩もショッキングピンクへ */
            white-space: nowrap;
            letter-spacing: 1px;
        }

        /* 【大改修】サブタイトルのネオンピンク化 */
        .title-sub {
            color: #ff007f;
            font-size: clamp(0.8rem, 4vw, 1.1rem);
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #ff007f;
        }

        p {
            font-size: clamp(0.8rem, 3.5vw, 0.95rem);
            line-height: 1.6;
            margin: 10px 0;
        }

        /* 運命のWORKSボタン */
        .btn-works {
            display: inline-block;
            background: transparent;
            padding: 18px 0;
            font-size: clamp(1.1rem, 5vw, 1.4rem);
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
            max-width: 320px;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            margin-top: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-works:hover, .btn-works:active {
            background: #00ffcc;
            color: #040408;
            box-shadow: 0 0 40px #00ffcc;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #8888aa;
            z-index: 10;
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>

    <canvas id="comet-canvas"></canvas>

    <div class="container">
        <h1>神島玲奈 宇宙哲学新要塞</h1>
        <div class="title-sub">MISSION: 地球文明救済</div>
        
        <p>「読者をサスペンスとロマンへ没頭させる<br>高尚なゲーミング遊び場」</p>
        <p style="color: #8888aa; font-size: 0.8rem; margin-bottom: 20px;">※現在、副官の手により作品領域を拡張工事中</p>

        <!-- 単一にして至高のワープゲート -->
        <a href="works.html" class="btn-works">ENTER WORKS</a>
    </div>

    <div class="footer">
        &copy; 宇宙総合指令官提督 神島玲奈 / Powered by Cloudflare Pages
    </div>

    <script>
        const canvas = document.getElementById('comet-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];

        window.addEventListener('mousemove', function(e) { spawnParticles(e.clientX, e.clientY); });
        window.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) spawnParticles(e.touches.clientX, e.touches.clientY);
        }, { passive: true });
        window.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) spawnParticles(e.touches.clientX, e.touches.clientY, 6);
        }, { passive: true });

        function spawnParticles(x, y, count = 2) {
            for (let i = 0; i < count; i++) { particles.push(new Particle(x, y)); }
        }

        // 星の子供（五色色彩火花）：エフェクト威力は100%完全維持！
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speedX = (Math.random() - 0.5) * 3.5;
                this.speedY = (Math.random() - 0.5) * 3.5;
                this.size = Math.random() * 3 + 1;
                const colors = ['#00ffcc', '#ff0055', '#ffffff', '#3399ff', '#ffcc00'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.decay = Math.random() * 0.025 + 0.015;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= this.decay; }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = this.color;
                ctx.shadowBlur = 8; ctx.shadowColor = this.color; ctx.fill(); ctx.restore();
            }
        }

        // 満天の銀河（40個の星々）
        const staticStars = [];
        for (let i = 0; i < 40; i++) {
            staticStars.push({
                x: Math.random(), y: Math.random(), size: Math.random() * 1.8 + 0.4,
                angle: Math.random() * Math.PI, speed: Math.random() * 0.02 + 0.01
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(4, 4, 8, 0.25)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            staticStars.forEach(star => {
                star.angle += star.speed; ctx.save();
                ctx.globalAlpha = 0.15 + Math.abs(Math.sin(star.angle)) * 0.85; ctx.beginPath();
                ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore();
            });
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
