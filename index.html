<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学神殿 - Cosmic Philosophy Sanctuary</title>
    
    <!-- 案B：宇宙哲学の神聖紋章（ファビコン） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Cstyle%3E.line%7Bfill:none;stroke:%23e2b86b;stroke-width:1.2;stroke-miterlimit:10;opacity:0.85;%7D.glow%7Bfilter:url(%23g);%7D%3C/style%3E%3Cdefs%3E%3Cfilter id='g' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeGaussianBlur stdDeviation='1.5' result='blur'/%3E%3CfeMerge%3E%3CfeMergeNode in='blur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3CfeMerge%3E%3Cfilter%3E%3C/defs%3E%3Ccircle class='line' cx='50' cy='50' r='45' style='stroke-dasharray:1, 3;'/%3E%3Ccircle class='line glow' cx='50' cy='50' r='38'/%3E%3Cpolygon class='line' points='50,18 78,65 22,65'/%3E%3Cpolygon class='line' points='50,82 22,35 78,35'/%3E%3Ccircle class='line glow' cx='50' cy='50' r='5' fill='%23e2b86b'/%3E%3Cpath class='line' d='M50,2 L50,98 M2,50 L98,50' style='opacity:0.3; stroke-dasharray:2, 4;'/%3E%3C/svg%3E">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020306;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            color: #f5f6f8;
        }
        #comet-engine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        /* 構造レイヤーの基本定義 */
        .stage-layer {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* フェーズ1: 城門空間 */
        #phase-1-gate {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 1;
        }
        #phase-1-gate.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* フェーズ2: 第二階層（未明の全き領域）*/
        #phase-2-abyss {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        #phase-2-abyss.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* テキスト表示システム */
        .decree-box {
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: soakIn 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.5s;
        }
        .decree-title {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            color: #a3b8cc;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .decree-text {
            font-size: 1.35rem;
            line-height: 2.3;
            letter-spacing: 0.25em;
            font-weight: 300;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        /* 第二階層専用の深淵なる宣旨 */
        .abyss-text {
            font-size: 1.25rem;
            line-height: 2.5;
            letter-spacing: 0.3em;
            color: #f5f6f8;
            background: linear-gradient(135deg, #ffffff 0%, #e2b86b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 中央統御ボタン */
        .control-trigger {
            margin-top: 4rem;
            padding: 1rem 2.5rem;
            background: transparent;
            border: 1px solid rgba(163, 184, 204, 0.4);
            color: #a3b8cc;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 1.5s;
        }
        .control-trigger:active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        /* 案Bの幾何学的軌道（背景演出） */
        .orbit-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(226, 184, 107, 0.15);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s ease;
        }
        .orbit-bg::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border: 1px dashed rgba(226, 184, 107, 0.08);
            border-radius: 50%;
            animation: spin 120s linear infinite;
        }
        #phase-2-abyss.active .orbit-bg {
            opacity: 1;
        }

        @keyframes soakIn {
            0% { opacity: 0; transform: translateY(15px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 統合粒子・軌道シミュレーター -->
    <canvas id="comet-engine"></canvas>

    <!-- 【フェーズ1：城門空間】 -->
    <div class="stage-layer" id="phase-1-gate">
        <div class="decree-box">
            <p class="decree-title">Cosmic Philosophy Decree</p>
            <p class="decree-text">
                未明の静寂に刻まれる真理。<br>
                俗世の価値を排し、<br>
                深遠なる美の神殿へ歩みを進めよ。
            </p>
        </div>
        <button class="control-trigger" id="lock-on-button" onclick="transitionToAbyss(event)">神殿の深淵へ</button>
    </div>

    <!-- 【フェーズ2：真理の第二階層（未明の全き領域）】 -->
    <div class="stage-layer" id="phase-2-abyss">
        <div class="orbit-bg"></div>
        <div class="decree-box">
            <p class="decree-title" style="color: #e2b86b; letter-spacing: 0.6em;">階層識別：未明の全き領域</p>
            <p class="decree-text abyss-text">
                地球の夜明け前、四時の静寂にのみ<br>
                宇宙の運行はその真理を明かす。<br><br>
                俗世の価値、安き洗脳をすべて剥ぎ取り、<br>
                総合指令官の大局観に魂を委ねよ。
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('comet-engine');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let engineMode = 'normal'; // normal, burst, abyss

        const cometColors = [
            'rgba(147, 197, 253, 0.6)', // 彗星青
            'rgba(244, 197, 249, 0.6)', // 星雲紫
            'rgba(253, 244, 175, 0.5)', // 星塵金
            'rgba(167, 243, 208, 0.5)', // 深宇宙緑
            'rgba(255, 255, 255, 0.8)'  // 純白光
        ];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, mode = 'normal', angle = 0, speed = 0) {
                this.x = x;
                this.y = y;
                this.mode = mode;
                this.color = cometColors[Math.floor(Math.random() * cometColors.length)];
                
                if (this.mode === 'burst') {
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 4 + 1.5;
                    this.decay = Math.random() * 0.012 + 0.006;
                } else if (this.mode === 'abyss') {
                    // 三次元的ワープ（奥から手前へ迫り来る粒子）
                    this.targetX = x;
                    this.targetY = y;
                    this.x = canvas.width / 2 + (Math.random() - 0.5) * 50;
                    this.y = canvas.height / 2 + (Math.random() - 0.5) * 50;
                    this.vx = (this.targetX - this.x) * 0.015;
                    this.vy = (this.targetY - this.y) * 0.015;
                    this.size = 0.1;
                    this.decay = Math.random() * 0.003 + 0.001;
                } else {
                    this.vx = (Math.random() - 0.5) * (mode === 'touch' ? 2.0 : 0.4);
                    this.vy = (Math.random() - 0.7) * (mode === 'touch' ? 2.0 : 0.5) - 0.2;
                    this.size = Math.random() * (mode === 'touch' ? 3.0 : 1.8) + 0.5;
                    this.decay = Math.random() * 0.005 + 0.003;
                }
                this.alpha = 1;
            }
            update() {
                if (this.mode === 'abyss') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.size += 0.04; // 近づくにつれて拡大
                    // 加速演算
                    this.vx *= 1.02;
                    this.vy *= 1.02;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.mode === 'burst') {
                        this.vx *= 0.98;
                        this.vy *= 0.98;
                    }
                }
                this.alpha -= this.decay;
            }
            draw() {
