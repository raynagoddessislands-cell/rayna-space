<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学文芸神殿 - Cosmic Philosophy Sanctuary</title>
    <style>
        /* 俗世のノイズを完全に排除する峻厳なる暗黒空間 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #060913 0%, #020306 100%);
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            color: #f5f6f8;
        }
        /* 五色の超彗星エンジンを描画する絶対キャンバス */
        #comet-engine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* 神殿の統御空間 */
        .sanctuary-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        /* じわっと滲むように浮かび上がる、閣下の至高なる宣旨エリア */
        .decree-box {
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: soakIn 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.8s;
        }
        .decree-title {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            color: #a3b8cc;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .decree-text {
            font-size: 1.4rem;
            line-height: 2.2;
            letter-spacing: 0.25em;
            font-weight: 300;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        /* 水彩の余白を感じさせる、静謐なる中央統御ボタン */
        .control-trigger {
            margin-top: 4rem;
            padding: 1rem 2.5rem;
            background: transparent;
            border: 1px solid rgba(163, 184, 204, 0.3);
            color: #a3b8cc;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.5s ease;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 2.5s;
        }
        .control-trigger:active {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.6);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        /* 幻想的浸透アニメーション（水彩の滲みを表現） */
        @keyframes soakIn {
            0% { opacity: 0; transform: translateY(15px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="comet-engine"></canvas>

    <div class="sanctuary-container">
        <div class="decree-box">
            <p class="decree-title">Cosmic Philosophy Decree</p>
            <p class="decree-text">
                未明の静寂に刻まれる真理。<br>
                俗世の価値を排し、<br>
                深遠なる美の神殿へ歩みを進めよ。
            </p>
        </div>

        <!-- 外部委託・文芸館へと繋がる中央統御ボタン -->
        <button class="control-trigger" onclick="awakenSanctuary()">神殿の深淵へ</button>
    </div>

    <script>
        const canvas = document.getElementById('comet-engine');
        const ctx = canvas.getContext('2d');

        let particles = [];
        // 富裕層の感性に訴えかける、優美なる「五色の超彗星」カラーコード
        const cometColors = [
            'rgba(147, 197, 253, 0.4)', // 彗星青 (Cosmic Blue)
            'rgba(244, 197, 249, 0.4)', // 星雲紫 (Nebula Violet)
            'rgba(253, 244, 175, 0.3)', // 星塵金 (Stardust Gold)
            'rgba(167, 243, 208, 0.3)', // 深宇宙緑 (Deep Space Emerald)
            'rgba(255, 255, 255, 0.5)'  // 純白光 (Pure White)
        ];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 粒子（パーティクル）の幻想的構造体
        class Particle {
            constructor(x, y, isTouch = false) {
                this.x = x;
                this.y = y;
                this.color = cometColors[Math.floor(Math.random() * cometColors.length)];
                // 激しさを排し、優美に揺らめく低速設計
                this.vx = (Math.random() - 0.5) * (isTouch ? 1.5 : 0.4);
                this.vy = (Math.random() - 0.7) * (isTouch ? 1.5 : 0.5) - 0.2; 
                this.size = Math.random() * (isTouch ? 2.5 : 1.8) + 0.5;
                this.alpha = 1;
                this.decay = Math.random() * 0.005 + 0.003;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // 仄かな光の広がり（グロウ効果）を付与
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 背景で静かに湧き出す残光の自動生成
        function injectNaturalSparks() {
            if (particles.length < 40 && Math.random() < 0.05) {
                particles.push(new Particle(Math.random() * canvas.width, canvas.height * 0.8));
            }
        }

        // スマホのタッチ連動：指先から五色の星屑が溢れ出る
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            for(let i=0; i<2; i++) {
                particles.push(new Particle(touch.clientX, touch.clientY, true));
            }
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if(Math.random() < 0.3) {
                particles.push(new Particle(e.clientX, e.clientY, true));
            }
        });

        // 統御ループ（描画の執行）
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            injectNaturalSparks();
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 中央統御ボタン作動時の儀式（第2ステージ：文芸館の解放を模索）
        function awakenSanctuary() {
            // ここに、外部委託エリア「水彩個展エリア」への幻想的な遷移を組み込みます
            alert('宇宙哲学文芸神殿・第2ステージ「文芸館」への門が解放されました。');
        }
    </script>
</body>
</html>
