<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学新要塞 - 神島玲奈指令官の領域</title>
    <style>
        /* 宇宙とゲーミングを融合したダークサイバー精神 */
        body {
            background-color: #0a0a16;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* 空間の歪み（背景演出） */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, #0a0a16 20%, #0a0a16 80%, transparent 80%, transparent),
                        radial-gradient(circle, transparent 20%, #0a0a16 20%, #0a0a16 80%, transparent 80%, transparent);
            background-size: 4px 4px;
            z-index: -1;
            opacity: 0.3;
        }

        /* 要塞の統制コンソール */
        .container {
            text-align: center;
            border: 2px solid #ff0055;
            padding: 40px;
            background: rgba(10, 10, 22, 0.8);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff0055;
        }

        .title-sub {
            color: #ff0055;
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* 運命のWorksボタン */
        .btn-works {
            display: inline-block;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        /* ボタンに触れた時の高尚なゲーミング反応 */
        .btn-works:hover {
            background: #00ffcc;
            color: #0a0a16;
            box-shadow: 0 0 30px #00ffcc;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #8888aa;
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <h1>神島玲奈 宇宙哲学新要塞</h1>
        <div class="title-sub">MISSION: 地球文明救済</div>
        
        <p>「読者をサスペンスとロマンへ没頭させる高尚なゲーミング遊び場」</p>
        <p style="color: #8888aa; font-size: 0.9rem; margin-bottom: 40px;">※現在、副官の手により要塞拡張工事中</p>

        <!-- 遊び場の起点となるボタン -->
        <a href="#works" class="btn-works" id="works-trigger">WORKS</a>
    </div>

    <div class="footer">
        &copy; 宇宙総合指令官提督 神島玲奈 / Powered by Cloudflare Pages
    </div>

    <script>
        // ボタンを押した際、サスペンスを予感させる演出（実験用）
        document.getElementById('works-trigger').addEventListener('click', function(e) {
            e.preventDefault();
            alert('【警告】これより閣下の脳内宇宙、および分冊ePub／UFOスケルトンPDFの防衛領域（Works）へと接続を試みます。準備を整えよ。');
        });
    </script>
</body>
</html>
