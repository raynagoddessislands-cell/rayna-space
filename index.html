<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学新要塞 - 神島玲奈指令官の領域</title>
    <style>
        /* 宇宙とゲーミングを融合したダークサイバー精神 */
        body {
            background-color: #06060c; /* より深い漆黒の宇宙へ */
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 10px #00ffcc;
            position: relative;
        }

        /* 満天の星々：煌めきエフェクト */
        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 星の共通仕様 */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
        }

        /* 3種類の異なるサイズと速度で煌めき（またたき）を分散 */
        .star.size-s { width: 1px; height: 1px; animation: blinkStar 2s infinite ease-in-out; }
        .star.size-m { width: 2px; height: 2px; animation: blinkStar 3s infinite ease-in-out; }
        .star.size-l { width: 3px; height: 3px; animation: blinkStar 4s infinite ease-in-out; box-shadow: 0 0 4px #fff; }

        /* 星のまたたきアニメーション */
        @keyframes blinkStar {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 要塞の統制コンソール（メインUI） */
        .container {
            text-align: center;
            border: 2px solid #ff0055;
            padding: 40px;
            background: rgba(6, 6, 12, 0.85); /* 星が透けるよう調整 */
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(4px); /* 背後の星をわずかににじませる近未来シールド */
            box-sizing: border-box;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff0055;
        }

        .title-sub {
            color: #ff0055;
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* 共通ボタン基本仕様 */
        .btn-works {
            display: inline-block;
            background: transparent;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
            max-width: 350px;
        }

        /* グリーンボタン仕様（WORKS） */
        .btn-green {
            color: #00ffcc;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            margin-bottom: 15px;
        }
        .btn-green:hover {
            background: #00ffcc;
            color: #06060c;
            box-shadow: 0 0 30px #00ffcc;
            transform: scale(1.03);
        }

        /* ピンクボタン仕様（AI CONSULTATION） */
        .btn-pink {
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }
        .btn-pink:hover {
            background: #ff0055;
            color: #06060c;
            box-shadow: 0 0 30px #ff0055;
            transform: scale(1.03);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #8888aa;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 満天の星々を展開するセクター -->
    <div class="star-field" id="cosmos"></div>

    <div class="container">
        <h1>神島玲奈 宇宙哲学新要塞</h1>
        <div class="title-sub">MISSION: 地球文明救済</div>
        
        <p>「読者をサスペンスとロマンへ没頭させる高尚なゲーミング遊び場」</p>
        <p style="color: #8888aa; font-size: 0.9rem; margin-bottom: 40px;">※現在、副官の手により要塞拡張工事中</p>

        <!-- 【結合完了】2つの重要セクターへのワープゲートボタン -->
        <a href="works.html" class="btn-works btn-green">WORKS</a>
        <br>
        <a href="consultation.html" class="btn-works btn-pink">AI CONSULTATION</a>
    </div>

    <div class="footer">
        &copy; 宇宙総合指令官提督 神島玲奈 / Powered by Cloudflare Pages
    </div>

    <script>
        // 【自動星々生成スクリプト】
        const cosmos = document.getElementById('cosmos');
        const starCount = 100;
        const sizes = ['size-s', 'size-m', 'size-l'];

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
            star.classList.add('star', randomSize);
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 4 + 's';
            cosmos.appendChild(star);
        }
    </script>
</body>
</html>
