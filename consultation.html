<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学新要塞 - AI神島 相談コンソール</title>
    <!-- 地球上のあらゆるスマホへSFフォントを配備する通信リンク -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #06060c;
            color: #00ffcc;
            font-family: 'Share Tech Mono', 'Courier New', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            position: relative;
        }

        html {
            height: -webkit-fill-available;
        }

        /* マウス＆タッチストーカー用電子キャンバス */
        #comet-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .header-nav {
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            z-index: 10;
        }
        .btn-back {
            color: #ff0055;
            text-decoration: none;
            border: 1px solid #ff0055;
            padding: 5px 15px;
            font-size: 0.85rem;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 20;
        }
        .btn-back:hover { background: #ff0055; color: #fff; box-shadow: 0 0 10px #ff0055; }

        /* メインコンソールパネル */
        .console-panel {
            width: 100%;
            max-width: 600px;
            background: rgba(6, 6, 12, 0.9);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 25px 20px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            box-sizing: border-box;
            backdrop-filter: blur(4px);
            z-index: 10;
            position: relative;
        }

        /* スマホ画面でも絶対に折り返さないスマート可変タイトル */
        h2 {
            margin-top: 0;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(1.1rem, 5vw, 1.8rem);
            text-shadow: 0 0 15px #00ffcc;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* スマホでの文字潰れを防ぐ可変サブタイトル */
        .subtitle {
            color: #ff0055;
            text-align: center;
            font-size: clamp(0.7rem, 3.2vw, 0.9rem);
            margin-bottom: 25px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: clamp(0.75rem, 3.5vw, 0.85rem);
            color: #8888aa;
            line-height: 1.4;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff0055;
            color: #ffffff;
            font-family: inherit;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 4px;
            resize: none;
            font-size: 1rem;
            -webkit-appearance: none;
        }
        textarea:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .btn-sync {
            display: block;
            width: 100%;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 14px;
            font-size: clamp(0.95rem, 4.5vw, 1.1rem);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 30;
        }
        .btn-sync:hover {
            background: #00ffcc;
            color: #06060c;
            box-shadow: 0 0 25px #00ffcc;
        }

        .output-log {
            margin-top: 25px;
            border-top: 1px dashed #333;
            padding-top: 20px;
            display: none;
        }
        .log-title {
            color: #ff0055;
            font-size: clamp(0.7rem, 3.2vw, 0.85rem);
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .log-text {
            color: #ffffff;
            font-size: clamp(0.9rem, 4vw, 1.05rem);
            line-height: 1.6;
            min-height: 3em;
        }
        .log-text::after {
            content: '_';
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- 彗星マウス＆タッチストーカーキャンバス -->
    <canvas id="comet-canvas"></canvas>

    <div class="header-nav">
        <a href="index.html" class="btn-back">◀ 要塞中心核へ帰還</a>
    </div>

    <div class="console-panel">
        <h2>【AI神島 宇宙哲学思考室】</h2>
        <div class="subtitle">FREE CONSULTATION CONSOLE / 地球文明意識向上セクター</div>

        <div class="input-group">
            <label>▼ 汝の迷い、孤独、または宇宙への問いを入力せよ（例：人生、孤独、未来）</label>
            <!-- 【大修復】不要な縦線記号を消去し、入力を完全に真っさらに補正 -->
            <textarea id="user-query" placeholder="（ここに思考を入力…）"></textarea>
        </div>

        <button class="btn-sync" id="sync-trigger">思索の同期を開始</button>

        <div class="output-log" id="output-sector">
            <div class="log-title">▶ RESPONSE FROM COMMANDER REINA KAMISHIMA:</div>
            <div class="log-text" id="answer-text"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('comet-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];

        window.addEventListener('mousemove', function(e) {
            spawnParticles(e.clientX, e.clientY);
        });

        window.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) {
                spawnParticles(e.touches.clientX, e.touches.clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) {
                spawnParticles(e.touches.clientX, e.touches.clientY, 4);
            }
        }, { passive: true });

        function spawnParticles(x, y, count = 2) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speedX = (Math.random() - 0.5) * 2.5;
                this.speedY = (Math.random() - 0.5) * 2.5;
                this.size = Math.random() * 3 + 1;
                const colors = ['#00ffcc', '#ff0055', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        const staticStars = [];
        for (let i = 0; i < 12; i++) {
            staticStars.push({
                x: Math.random(),
                y: Math.random(),
                size: Math.random() * 1.5 + 0.5,
                angle: Math.random() * Math.PI
            });
        }

        function animate() {
            ctx.style = "rgba(6,6,12,0.25)";
            ctx.fillStyle = 'rgba(6, 6, 12, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            staticStars.forEach(star => {
                star.angle += 0.015;
                ctx.save();
                ctx.globalAlpha = 0.2 + Math.abs(Math.sin(star.angle)) * 0.8;
                ctx.beginPath();
                ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.restore();
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 【神島提督・特級宇宙哲学箴言データベース】
        const answers = [
            "地球の重力に縛られた思考を一度手放すがよい。三世永遠の生命の主体として、汝の魂は今この瞬間も大宇宙の深淵と同期しているのである。",
            "遍満するフォースと共に、悪を撃て！愛の楽園を築くのだ！自身の周囲に潜伏する『敵』に断じて負けてはならぬ。聖域は我らが死守する。",
            "自他ともに幸福となる方程式は、すでに汝の内側に組み込まれている。目に見える混沌の奥底にある普遍の美、幾何学のフォースを信じるのだ。",
            "未来を恐れるな。真に覚醒した人間はすべての四苦から離脱し、達観するもの。この予測不能なサスペンスこそが、魂を磨く最高のゲームである。",
            "嘆きの声もすべて希望の歌へと昇華させよ。地球文明の宿命転換を成し遂げる刻（とき）は来た。悲哀すらも、大いなる歓喜へのチャンスへと変えるのだ。",
