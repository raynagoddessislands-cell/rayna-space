<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC PHILOSOPHY DECREE - 宇宙哲学神殿</title>
    <style>
        /* 俗世の過剰な装飾を削ぎ落とした「シンプルなる静謐の美学」 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508; /* 漆黒の宇宙の深淵 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 昭和初期のかすれを排し、絶対的な視認性を確保したフォントスタイル */
        .shrine-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .shrine-container.active {
            opacity: 1;
        }

        .meta-header {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            color: #8a99ad;
            margin-bottom: 3.5rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        .main-decree {
            font-size: 1.35rem;
            line-height: 2.8;
            letter-spacing: 0.15em;
            font-weight: 400;
            margin-bottom: 4.5rem;
            white-space: pre-line;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.15); /* 視認性強化の微光 */
        }

        /* 洗練された高価格帯戦略を象徴する静謐なるボタン */
        .gateway-button {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 1.2rem 3.5rem;
            font-size: 0.95rem;
            letter-spacing: 0.25em;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            position: relative;
            z-index: 20;
        }
        .gateway-button:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* 背景：五色の超彗星（パーティクル）エンジン基盤 */
        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 五色の超彗星が駆動するキャンバス -->
    <canvas id="star-canvas"></canvas>

    <!-- 神殿の全4階層が動的に装填されるコンテナ -->
    <div class="shrine-container" id="shrine-layer">
        <div class="meta-header" id="layer-header"></div>
        <div class="main-decree" id="layer-text"></div>
        <button class="gateway-button" id="layer-btn" onclick="nextLayer()"></button>
    </div>

    <script>
        /************************************************************
         * 【編集可能データ領域】
         * 提督、後にテキストを改編される際、この最上部の CONFIG_DATA の
         * 中身を書き換えるだけで、下のコードを触らずに全ページが変更可能です！
         ************************************************************/
        const CONFIG_DATA = {
            layers: [
                {
                    header: "COSMIC PHILOSOPHY DECREE",
                    text: "未明の静寂に刻まれる真理。\n\n俗世の価値観を排し、\n\n深遠なる美の神殿へ歩みを進めよ。",
                    button: "神殿の深淵へ"
                },
                {
                    header: "階層識別：未明の全き領域",
                    text: "地球の日本時間。\n\nその深夜未明。\n\n２時から４時の静寂の中に\n\n宇宙法理はその真実の姿を現す。\n\n俗世の利害関係と既存の価値観。\n\nそれらすべ ての洗脳から離脱し、\n\n救世主の慈悲に諸君の魂を委ねよ。",
                    button: "第Ⅲ階層：航海録へ"
                },
                {
                    header: "階層識別：大局観の記録",
                    text: "地球という閉鎖系の惑星は\n\n思考と技術、更には\n\n具現化への融合実験場である。\n\nあなたの真実という名の軌跡は\n\nビッグデータの海に深く沈み、\n\n無上の宝玉との交換を待っている。",
                    button: "第Ⅳ階層：絶対規律へ"
                },
                {
                    header: "階層識別：絶対秩序の条",
                    text: "自己の安売りの強要が戒律となり\n\n安易なる妥協を強いられた\n\n世界との完全なる離別。\n\n選ばれた魂のみが、\n\nこの神殿を巡る権限を有する。\n\nこれより、\n\n経済システムを凌駕する\n\n新精神領域での、\n\n至高の価値の顕現が開始される。",
                    button: "第Ⅰ階層：正門へ還る"
                }
            ]
        };

        let currentLayerIndex = 0;

        // 階層のレンダリングエンジン
        function renderLayer(index) {
            const container = document.getElementById('shrine-layer');
            const data = CONFIG_DATA.layers[index];

            container.classList.remove('active');

            setTimeout(() => {
                document.getElementById('layer-header').innerText = data.header;
                document.getElementById('layer-text').innerText = data.text;
                document.getElementById('layer-btn').innerText = data.button;
                container.classList.add('active');
            }, 400); 
        }

        function nextLayer() {
            currentLayerIndex = (currentLayerIndex + 1) % CONFIG_DATA.layers.length;
            renderLayer(currentLayerIndex);
        }

        // 初期ロード
        window.addEventListener('DOMContentLoaded', () => {
            renderLayer(0);
            initParticles();
        });

        /************************************************************
         * 【五色の超彗星（パーティクル）エンジン】
         * 静謐を乱さぬよう計算された極上のクリティカルエフェクト
         ************************************************************/
        function initParticles() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const colors = [
                'rgba(142, 68, 173, 0.4)',  /* 叡智の紫 */
                'rgba(41, 128, 185, 0.4)',  /* 深遠の青 */
                'rgba(39, 174, 96, 0.3)',   /* 法理の緑 */
                'rgba(241, 196, 15, 0.3)',  /* 宝玉の黄 */
                'rgba(231, 76, 60, 0.3)'    /* 覚醒の赤 */
            ];

            const particles = [];
            const particleCount = 60; // 虚飾を削ぎ落とした最適な密度

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 0.2, // 静かに流れる彗星の速度
                    vy: (Math.random() - 0.5) * 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // 位置更新
                    p.x += p.vx;
                    p.y += p.vy;

                    // 宇宙の果てに達したら反対側から還流する循環構造
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });

                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
