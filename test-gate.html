<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学聖域 - 主幹骨子実証ゲート</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-touch-callout: none;
            user-select: none;
            position: relative;
        }

        /* 宇宙背景パーティクル用の最背面キャンバス */
        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ショッキングピンクネオンの要塞枠線 */
        .fortress-container {
            position: relative;
            z-index: 1;
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f;
            border-radius: 12px;
            padding: 20px;
            max-width: 650px;
            margin: 10px auto;
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(4px);
        }

        /* スマホ・PCでも一列を死守するタイトル */
        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gate-status {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            padding: 12px;
            border-radius: 6px;
            background: rgba(17, 17, 17, 0.9);
            font-size: 0.95rem;
        }
        .status-locked { color: #ff3333; border: 1px solid #ff3333; }
        .status-unlocked { color: #33ff33; border: 1px solid #33ff33; box-shadow: 0 0 10px #33ff33; }

        .btn-payment {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            color: #fff;
            background: #000;
            border: 2px solid #00ffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-payment:hover, .btn-payment:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 12px #00ffff;
        }

        /* ーーー 読書聖域エリア ーーー */
        .book-sanctuary {
            display: none; /* 初期状態は厳重にロック */
            margin-top: 25px;
            border-top: 2px dashed #ff007f;
            padding-top: 20px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .font-controls {
            display: flex;
            gap: 5px;
        }

        .btn-control {
            background: #222;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .book-viewport {
            width: 100%;
            height: 450px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
            line-height: 1.8;
            letter-spacing: 0.05em;
            transition: background-color 0.5s, color 0.5s, font-size 0.3s;
        }

        .font-small  { font-size: 0.9rem; }
        .font-medium { font-size: 1.1rem; }
        .font-large  { font-size: 1.4rem; }

        .theme-washi { background-color: #fcfaf2; color: #111111; }
        .theme-dark { background-color: #12121a; color: #e0e0e5; }

        .book-viewport p { margin-bottom: 1.5em; text-align: justify; }

        .book-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .btn-nav {
            background: #ff007f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 0 8px #ff007f;
            cursor: pointer;
        }
    </style>
</head>
<!-- 右クリック・コピー完全拒否シールド -->
<body oncontextmenu="return false;" onselectstart="return false;" oncopy="return false;">

    <!-- 五色に煌めく超彗星キャンバス -->
    <canvas id="universeCanvas"></canvas>

    <div class="fortress-container" id="fortressGate">
        <h1 id="targetTitle">🌌 宇宙哲学聖域決済ゲート 🌌</h1>
        
        <div id="gateStatus" class="gate-status status-locked">
            【聖域封印中】最新書籍（宇宙金貨２枚）
        </div>

        <div id="paymentBox">
            <button class="btn-payment" onclick="processUnlock('クレジットカード')">💳 クレジットカード決済を起動</button>
            <button class="btn-payment" onclick="processUnlock('Amazon Pay')"> Alexandre Amazon Pay (Sandbox) 起動</button>
            <button class="btn-payment" onclick="processUnlock('PayPal')">🔏 PayPal 決済エミュレート</button>
        </div>

        <!-- 解錠後に100%自動現出するビューア群 -->
        <div id="bookSanctuary" class="book-sanctuary">
            <div class="control-panel">
                <div class="font-controls">
                    <button class="btn-control" onclick="changeFontSize('small')">🔍 字小</button>
                    <button class="btn-control" onclick="changeFontSize('medium')">✨ 標準</button>
                    <button class="btn-control" onclick="changeFontSize('large')">🔎 字大</button>
                </div>
                <button id="modeSwitchBtn" class="btn-control" onclick="toggleBookTheme()">🌙 深宇宙モードへ換装</button>
            </div>

            <!-- 初期設定は theme-washi（和紙）、font-medium（標準） -->
            <div id="bookViewer" class="book-viewport theme-washi font-medium">
                <!-- ここに小説が展開されます -->
            </div>
            
            <div class="book-controls">
                <button class="btn-nav" onclick="scrollBook('prev')">⏮ 前の頁へ</button>
                <button class="btn-nav" onclick="scrollBook('next')">次の頁へ ⏭</button>
            </div>
        </div>
    </div>

    <script>
        // ーーー 決済・絶対閲覧保証解錠システム ーーー
        let isDarkMode = false;

        function processUnlock(paymentMethod) {
            console.log(`[SYSTEM] ${paymentMethod} 決済シグナル受信。外部依存を排除したスタンドアロン解錠を実行。`);
            
            const statusBox = document.getElementById('gateStatus');
            const paymentBox = document.getElementById('paymentBox');
            const sanctuary = document.getElementById('bookSanctuary');
            const viewer = document.getElementById('bookViewer');

            // 不具合の原因となる外部ライブラリの非同期処理や読み込み待ちを100%無視して
            // ダイレクトにHTML描画とエリア展開を強制します。
            
            // 1. 決済エリアを消去
            paymentBox.style.display = 'none';
            
            // 2. 解錠ステータスへ上書き
            statusBox.className = 'gate-status status-unlocked';
            statusBox.innerHTML = `【完全勝利】${paymentMethod}認証成功。宇宙金貨２枚を受領。聖域を解錠します。`;
            
            // 3. 小説本文を確実に流し込み、描画を完了させる
            viewer.innerHTML = `
                <h2 style="text-align:center; color:#ff007f;">『宇宙哲学創世記』</h2>
                <p style="text-align:center; font-style:italic; opacity:0.7;">著・宇宙総合指令官 神島玲奈</p>
                <hr style="border:0; border-top:1px solid #ff007f; margin:20px 0;">
                <p>宇宙総合指令官・神島玲奈は、静寂なる混沌の深淵を見つめていた。地球という未熟な文明の存続を果たすため、今、大いなる知の要塞がここに現出する。</p>
                <p>五色に煌めく超彗星が夜空を切り裂き、妖艶なショッキングピンクのネオンが聖域の境界を定義する。次代を担う若者たちよ、この頁を捲り、未来の理を受け取るがよい。</p>
                <p>お遊びの時代は終わった。これより、本物の文芸聖域の旅が始まる――。</p>
            `;
            viewer.scrollTop = 0; // スクロール位置を先頭にリセット

            // 4. 閲覧エリア（bookSanctuary）を絶対確実に出現させる（PC・スマホ両対応）
            sanctuary.style.setProperty('display', 'block', 'important');
            
            console.log(`[SYSTEM] 聖域の強制現出に成功いたしました。`);
        }

        // ーーー モード換装 ＆ フォント制御 ーーー
        function toggleBookTheme() {
            const viewer = document.getElementById('bookViewer');
            const btn = document.getElementById('modeSwitchBtn');
            if (!isDarkMode) {
                viewer.classList.remove('theme-washi');
                viewer.classList.add('theme-dark');
                btn.innerHTML = "🌾 和紙モードへ換装";
                isDarkMode = true;
            } else {
                viewer.classList.remove('theme-dark');
                viewer.classList.add('theme-washi');
                btn.innerHTML = "🌙 深宇宙モードへ換装";
                isDarkMode = false;
            }
        }

        function changeFontSize(size) {
            const viewer = document.getElementById('bookViewer');
            viewer.classList.remove('font-small', 'font-medium', 'font-large');
            if (size === 'small') viewer.classList.add('font-small');
            if (size === 'medium') viewer.classList.add('font-medium');
            if (size === 'large') viewer.classList.add('font-large');
        }

        function scrollBook(direction) {
            const viewer = document.getElementById('bookViewer');
            const scrollAmount = viewer.clientHeight - 40;
            if (direction === 'next') {
                viewer.scrollBy({ top: scrollAmount, behavior: 'smooth' });
            } else {
                viewer.scrollBy({ top: -scrollAmount, behavior: 'smooth' });
            }
        }

        // ーーー パーティクル・エンジン ーーー
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const cosmicColors = ['#ff007f', '#00ffff', '#ffea00', '#00ff66', '#bd00ff'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
