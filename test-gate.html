<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学聖域 - 主幹骨子実証ゲート</title>
    <!-- Word(.docx)安定版解析ライブラリ -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-touch-callout: none;
            user-select: none;
            position: relative;
        }

        /* 宇宙背景パーティクル用の最背面キャンバス */
        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none; /* 下のボタン操作を邪魔しない */
        }

        /* ショッキングピンクネオンの要塞枠線 */
        .fortress-container {
            position: relative;
            z-index: 1; /* キャンバスより前に配置 */
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f;
            border-radius: 12px;
            padding: 20px;
            max-width: 650px;
            margin: 10px auto;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(4px); /* 背景の星を妖艶にぼかす */
        }

        /* スマホでも一列を死守するタイトル */
        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 0;
            white-space: nowrap; /* 一列を絶対に追従 */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gate-status {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            padding: 12px;
            border-radius: 6px;
            background: rgba(17, 17, 17, 0.9);
            font-size: 0.95rem;
        }
        .status-locked { color: #ff3333; border: 1px solid #ff3333; }
        .status-unlocked { color: #33ff33; border: 1px solid #33ff33; box-shadow: 0 0 10px #33ff33; }

        .btn-payment {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            color: #fff;
            background: #000;
            border: 2px solid #00ffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-payment:hover, .btn-payment:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 12px #00ffff;
        }

        /* ーーー 読書聖域エリア ーーー */
        .book-sanctuary {
            display: none; 
            margin-top: 25px;
            border-top: 2px dashed #ff007f;
            padding-top: 20px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .font-controls {
            display: flex;
            gap: 5px;
        }

        .btn-control {
            background: #222;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .book-viewport {
            width: 100%;
            height: 450px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
            line-height: 1.8;
            letter-spacing: 0.05em;
            transition: background-color 0.5s, color 0.5s, font-size 0.3s;
        }

        .font-small  { font-size: 0.9rem; }
        .font-medium { font-size: 1.1rem; }
        .font-large  { font-size: 1.4rem; }

        .theme-washi { background-color: #fcfaf2; color: #111111; }
        .theme-dark { background-color: #12121a; color: #e0e0e5; }

        .book-viewport p { margin-bottom: 1.5em; text-align: justify; }

        .book-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .btn-nav {
            background: #ff007f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 0 8px #ff007f;
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" oncopy="return false;">

    <!-- 五色に煌めく超彗星を宿す電脳キャンバス -->
    <canvas id="universeCanvas"></canvas>

    <div class="fortress-container" id="fortressGate">
        <h1 id="targetTitle">🌌 宇宙哲学聖域決済ゲート 🌌</h1>
        
        <div id="gateStatus" class="gate-status status-locked">
            【聖域封印中】最新書籍（宇宙金貨２枚）
        </div>

        <div id="paymentBox">
            <button class="btn-payment" onclick="processUnlock('クレジットカード')">💳 クレジットカード決済を起動</button>
            <button class="btn-payment" onclick="processUnlock('Amazon Pay')"> Alexandre Amazon Pay (Sandbox) 起動</button>
            <button class="btn-payment" onclick="processUnlock('PayPal')">🔏 PayPal 決済エミュレート</button>
        </div>

        <div id="bookSanctuary" class="book-sanctuary">
            <div class="control-panel">
                <div class="font-controls">
                    <button class="btn-control" onclick="changeFontSize('small')">🔍 字小</button>
                    <button class="btn-control" onclick="changeFontSize('medium')">✨ 標準</button>
                    <button class="btn-control" onclick="changeFontSize('large')">🔎 字大</button>
                </div>
                <button id="modeSwitchBtn" class="btn-control" onclick="toggleBookTheme()">🌙 深宇宙モードへ換装</button>
            </div>

            <div id="bookViewer" class="book-viewport theme-washi font-medium">
                <p style="color: #666; text-align: center;">宇宙データを展開中...</p>
            </div>
            
            <div class="book-controls">
                <button class="btn-nav" onclick="scrollBook('prev')">⏮ 前の頁へ</button>
                <button class="btn-nav" onclick="scrollBook('next')">次の頁へ ⏭</button>
            </div>
        </div>
    </div>

    <script>
        // ーーー スマホ完全対応：五色の超彗星パーティクル・エンジン ーーー
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        // 五色に煌めく宇宙のカラーパレット
        const cosmicColors = ['#ff007f', '#00ffff', '#ffea00', '#00ff66', '#bd00ff'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, isStar = false) {
                this.x = x;
                this.y = y;
                this.isStar = isStar; // 満天の星か、超彗星か
                this.size = isStar ? Math.random() * 1.5 : Math.random() * 3 + 1;
                this.color = isStar ? '#ffffff' : cosmicColors[Math.floor(Math.random() * cosmicColors.length)];
                this.speedX = isStar ? 0 : (Math.random() - 0.5) * 2;
                this.speedY = isStar ? Math.random() * 0.2 + 0.05 : (Math.random() - 0.5) * 2; // 星はゆっくり降下
                this.alpha = 1;
                this.decay = isStar ? 0 : Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (!this.isStar) {
                    this.alpha -= this.decay;
                } else if (this.y > canvas.height) {
                    this.y = 0; // 画面外に出た星は上に戻る
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 初期配置：背景に満天の星々を100個配置
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height, true));
        }

        // スマホのタップ・移動、または一列のタイトルの位置を追従して超彗星を生成
        function箇発超彗星(x, y) {
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle(x, y, false));
            }
        }

        // タイトル周囲の自動追従エフェクト
        function autoTitlePulse() {
            const rect = document.getElementById('targetTitle').getBoundingClientRect();
            // タイトルの横一列の範囲に彗星を自動発生
            const randomX = rect.left + Math.random() * rect.width;
            const randomY = rect.top + Math.random() * rect.height;
            箇発超彗星(randomX, randomY);
        }

        // スマホのタッチイベントを完全迎撃
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                箇発超彗星(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('mousemove', (e) => {
            箇発超彗星(e.clientX, e.clientY);
        });

        // アニメーションループ（超高速・軽量描画）
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // タイトル追従の彗星パルス
            autoTitlePulse();

            particles = particles.filter(p => p.isStar || p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // ーーー 決済・解錠・フォント・テーマ統御システム ーーー
