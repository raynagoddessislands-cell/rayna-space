<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任務分離実験室 - 決済解錠テストゲート</title>
    <style>
        /* 閣下の世界観を構築する超彗星・ネオン装飾 */
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Georgia', 'Times New Roman', serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 枠線を妖艶なショッキングピンクネオンに換装 */
        .fortress-container {
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f;
            border-radius: 10px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
            font-size: 1.5rem;
        }

        .gate-status {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            background: #222;
        }

        .status-locked { color: #ff3333; border: 1px solid #ff3333; }
        .status-unlocked { color: #33ff33; border: 1px solid #33ff33; box-shadow: 0 0 10px #33ff33; }

        .btn-payment {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            color: #fff;
            background: #111;
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-payment:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 10px #00ffff;
        }

        /* 文芸聖域（小説本文エリア）*/
        .sanctuary-content {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-top: 2px dashed #ff007f;
            line-height: 1.8;
            letter-spacing: 0.05em;
            background: #0a0a15;
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<!-- 右クリック完全拒否シールドの実装 -->
<body oncontextmenu="return false;" onselectstart="return false;" oncopy="return false;">

    <div class="fortress-container">
        <h1>宇宙哲学聖域決済ゲート</h1>
        
        <div id="gateStatus" class="gate-status status-locked">
            【聖域封印中】商業戦略分冊（宇宙金貨２枚）
        </div>

        <!-- トリプル決済模擬シミュレーター（Sandbox環境準拠） -->
        <div id="paymentBox">
            <button class="btn-payment" onclick="executeSimulatedPayment('クレジットカード')">💳 クレジットカード決済を起動</button>
            <button class="btn-payment" onclick="executeSimulatedPayment('Amazon Pay')"> Alexandre Amazon Pay (Sandbox) 起動</button>
            <button class="btn-payment" onclick="executeSimulatedPayment('PayPal')">🔏 PayPal 決済エミュレート</button>
        </div>

        <!-- 100％自動解錠・タイピング連動システム搭載の本文 -->
        <div id="literarySanctuary" class="sanctuary-content"></div>
    </div>

    <script>
        // 実在の小説本文データ（破損データを完全排除した純粋結晶）
        const sacredText = `【宇宙哲学創世記 - 第一章】
宇宙総合指令官・神島玲奈は、無限 of 混沌を見つめていた。
五色に煌めく超彗星が虚空を切り裂き、ショッキングピンクの星雲が新たな要塞の誕生を告げる。
「お遊びはここまでだ。これより本物の文芸聖域を現出させる」
その言葉とともに、タイピングの波動は宇宙の理を書き換えていった――。`;

        // 100%自動解錠およびタイピング連動処理
        function executeSimulatedPayment(method) {
            console.log(`[SYSTEM] ${method} 決済シグナルを受信。認証中...`);
            
            // 決済成功後の自動解錠プロセス
            const statusBox = document.getElementById('gateStatus');
            const paymentBox = document.getElementById('paymentBox');
            const sanctuary = document.getElementById('literarySanctuary');

            paymentBox.style.display = 'none';
            statusBox.className = 'gate-status status-unlocked';
            statusBox.innerHTML = `【完全勝利】${method}経由による解錠に成功。聖域を展開します。`;
            
            // タイピング連動自動生成
            sanctuary.style.display = 'block';
            typeWriterEffect(sacredText, 'literarySanctuary', 50);
        }

        // タイピング連動エフェクト
        function typeWriterEffect(text, elementId, speed) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = ""; // 初期化

            function typing() {
                if (i < text.length) {
                    // 改行コードの自動変換処理
                    if (text.charAt(i) === '\n') {
                        element.innerHTML += '<br>';
                    } else {
                        element.innerHTML += text.charAt(i);
                    }
                    i++;
                    setTimeout(typing, speed);
                }
            }
            typing();
        }
    </script>
</body>
</html>
