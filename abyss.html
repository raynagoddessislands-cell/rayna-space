<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙哲学神殿 - 未明の全き領域</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Cstyle%3E.line%7Bfill:none;stroke:%23e2b86b;stroke-width:1.2;stroke-miterlimit:10;opacity:0.85;%7D.glow%7Bfilter:url(%23g);%7D%3C/style%3E%3Cdefs%3E%3Cfilter id='g' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeGaussianBlur stdDeviation='1.5' result='blur'/%3E%3CfeMerge%3E%3CfeMergeNode in='blur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Ccircle class='line' cx='50' cy='50' r='45' style='stroke-dasharray:1, 3;'/%3E%3Ccircle class='line glow' cx='50' cy='50' r='38'/%3E%3Cpolygon class='line' points='50,18 78,65 22,65'/%3E%3Cpolygon class='line' points='50,82 22,35 78,35'/%3E%3Ccircle class='line glow' cx='50' cy='50' r='5' fill='%23e2b86b'/%3E%3Cpath class='line' d='M50,2 L50,98 M2,50 L98,50' style='opacity:0.3; stroke-dasharray:2, 4;'/%3E%3C/svg%3E">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020306;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            color: #f5f6f8;
        }
        #comet-engine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }
        .sanctuary-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            background: transparent;
        }
        .decree-box {
            max-width: 600px;
            opacity: 0;
            transform: translateY(15px);
            animation: soakIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .decree-title {
            font-size: 0.85rem;
            letter-spacing: 0.6em;
            color: #e2b86b;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .decree-text {
            font-size: 1.3rem;
            line-height: 2.4;
            letter-spacing: 0.28em;
            font-weight: 300;
            background: linear-gradient(135deg, #ffffff 0%, #e2b86b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(226,184,107,0.1);
        }
        .orbit-bg {
            position: absolute;
            width: 330px;
            height: 330px;
            border: 1px dashed rgba(226, 184, 107, 0.12);
            border-radius: 50%;
            pointer-events: none;
            animation: spin 160s linear infinite;
            z-index: 1;
        }
        @keyframes soakIn {
            0% { opacity: 0; transform: translateY(15px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <canvas id="comet-engine"></canvas>
    <div class="orbit-bg"></div>

    <div class="sanctuary-container">
        <div class="decree-box">
            <p class="decree-title">階層識別：未明の全き領域</p>
            <p class="decree-text">
                地球の夜明け前、四時の静寂にのみ<br>
                宇宙の運行はその真理を明かす。<br><br>
                俗世の価値、安き洗脳をすべて剥ぎ取り、<br>
                総合指令官の大局観に魂を委ねよ。
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('comet-engine');
        const ctx = canvas.getContext('2d');
        let particles = [];

        const cometColors = [
            'rgba(147, 197, 253, 0.55)',
            'rgba(244, 197, 249, 0.55)',
            'rgba(253, 244, 175, 0.45)',
            'rgba(167, 243, 208, 0.45)',
            'rgba(255, 255, 255, 0.75)'
        ];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor(x, y, type = 'normal') {
                this.x = x;
                this.y = y;
                this.color = cometColors[Math.floor(Math.random() * cometColors.length)];
                this.vx = (Math.random() - 0.5) * (type === 'touch' ? 1.8 : 0.4);
                this.vy = (Math.random() - 0.7) * (type === 'touch' ? 1.8 : 0.5) - 0.2;
                this.size = Math.random() * (type === 'touch' ? 2.8 : 1.6) + 0.5;
                this.decay = Math.random() * 0.005 + 0.003;
                this.alpha = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function injectNaturalSparks() {
            if (particles.length < 50 && Math.random() < 0.08) {
                particles.push(new Particle(Math.random() * canvas.width, canvas.height * 0.85, 'normal'));
            }
        }

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const t = e.touches[0];
                particles.push(new Particle(t.clientX, t.clientY, 'touch'));
            }
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (Math.random() < 0.4) {
                particles.push(new Particle(e.clientX, e.clientY, 'touch'));
            }
        });

        function renderLoop() {
            ctx.fillStyle = 'rgba(2, 3, 6, 0.14)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            injectNaturalSparks();
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }
            requestAnimationFrame(renderLoop);
        }
        renderLoop();
    </script>
</body>
</html>
